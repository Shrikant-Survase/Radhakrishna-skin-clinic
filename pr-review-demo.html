<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Appointment Booking — PR Review Test</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 3rem auto; padding: 0 1rem; color: #16211d; }
    label { display: block; margin: 1rem 0 .35rem; font-weight: 600; }
    input, button { box-sizing: border-box; width: 100%; padding: .75rem; font: inherit; }
    button { margin-top: 1rem; cursor: pointer; }
    #confirmation { margin-top: 1rem; color: #1f4a3d; }
  </style>
</head>
<body>
  <main>
    <h1>Request an appointment</h1>
    <p>Same-day appointments are available when requested before the clinic closes.</p>
    <form id="appointment-form">
      <label for="appointment-date">Preferred date</label>
      <input id="appointment-date" name="date" type="date" required>

      <label for="patient-name">Your name</label>
      <input id="patient-name" name="name" autocomplete="name" required>

      <button type="submit">Request appointment</button>
    </form>
    <p id="confirmation" role="status" aria-live="polite"></p>
  </main>
  <script>
    const dateInput = document.getElementById('appointment-date');
    const today = new Date();
    today.setDate(today.getDate() + 1); // Intentionally seeded review bug: excludes same-day bookings.
    dateInput.min = today.toISOString().split('T')[0];

    document.getElementById('appointment-form').addEventListener('submit', (event) => {
      event.preventDefault();
      const name = document.getElementById('patient-name').value.trim();
      document.getElementById('confirmation').textContent = `Thanks, ${name}. Your request is ready for clinic confirmation.`;
    });
  </script>
</body>
</html>
